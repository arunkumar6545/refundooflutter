workflows:

  # ─────────────────────────────────────────────────────────────────────────────
  # Android – release split APKs (~15-20 MB each, one per CPU architecture)
  #   Signing: uses a self-generated debug keystore automatically — no setup needed.
  #   The arm64-v8a APK works on every Android phone made after 2017.
  # ─────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release APKs (split)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Generate keystore and key.properties
        script: |
          KEYSTORE="$HOME/refundoo-release.keystore"

          # Generate a self-signed keystore (valid 10000 days)
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias refundookey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass refundoo123 -keypass refundoo123 \
            -dname "CN=Refundoo,O=Refundoo,C=IN"

          # Write key.properties so build.gradle can find the keystore
          cat > android/key.properties <<EOF
          storePassword=refundoo123
          keyPassword=refundoo123
          keyAlias=refundookey
          storeFile=$KEYSTORE
          EOF

      - name: Build release split APKs
        script: |
          flutter build apk --release --split-per-abi

    artifacts:
      # arm64-v8a  = all modern phones (use this one)
      # armeabi-v7a = older 32-bit phones
      # x86_64      = emulators / testing
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # Android – debug APK (fat single file, kept for quick local testing)
  # ─────────────────────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug APK (fat)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS – unsigned build (no Apple Developer account required)
  #   Produces an IPA you can install via AltStore / Sideloadly on any device,
  #   or open in the iOS Simulator. Perfect for testing before paying for a
  #   developer account.
  # ─────────────────────────────────────────────────────────────────────────────
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Scaffold iOS Xcode project
        script: |
          # Adds missing Xcode project files (xcodeproj, AppDelegate, storyboards,
          # Podfile). Does NOT touch lib/ or existing Dart code.
          flutter create --platforms=ios --org com.refundoo --project-name refundoo .

      - name: Apply Info.plist customisations
        script: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Refundoo"  "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Refundoo"         "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Used to protect your refund data'" "$PLIST" 2>/dev/null || true

      - name: Build unsigned archive
        # flutter build ipa runs pod install automatically
        script: flutter build ipa --no-codesign --release

      - name: Package archive into IPA for sideloading
        script: |
          ARCHIVE="build/ios/archive/Runner.xcarchive"
          IPA_DIR="build/ios/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$ARCHIVE/Products/Applications/Runner.app" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -r Refundoo.ipa Payload
          rm -rf Payload

    artifacts:
      - build/ios/ipa/Refundoo.ipa
      - /tmp/xcodebuild_logs/*.log

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS – signed build for TestFlight / App Store
  #   Prerequisites (one-time setup in Codemagic dashboard):
  #     1. Apple Developer account ($99/yr)
  #     2. Add an App Store Connect API key in Codemagic → Integrations
  #     3. Register bundle ID "com.refundoo.app" in developer.apple.com
  #     4. Create an App in App Store Connect with the same bundle ID
  #
  #   Once those are done, trigger this workflow and Codemagic will handle
  #   certificate + provisioning profile automatically.
  # ─────────────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic          # name of the key set in Codemagic dashboard
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.refundoo.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Scaffold iOS Xcode project
        script: |
          flutter create --platforms=ios --org com.refundoo --project-name refundoo .

      - name: Set bundle identifier
        script: |
          BUNDLE_ID="com.refundoo.app"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Apply Info.plist customisations
        script: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Refundoo"  "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Refundoo"         "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Used to protect your refund data'" "$PLIST" 2>/dev/null || true

      - name: Build signed IPA
        # flutter build ipa runs pod install automatically
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - External Testers
