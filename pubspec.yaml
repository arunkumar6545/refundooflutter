name: refundoo
description: Refund tracking app - scan SMS and emails for refunds.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  telephony: ^0.2.0
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
